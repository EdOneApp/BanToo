    <script>
      // Decodes the redirect produced by public/404.html on GitHub Pages so
      // React Router sees the real path the user asked for, before React
      // ever mounts. No-op on hosts that don't need the 404.html trick.
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var redirect = params.get('redirect')
        if (redirect) {
          window.history.replaceState(null, '', '%BASE_URL%'.replace(/\/$/, '') + redirect)
        }
